PLG_EDITORS_FGEDITORSWITCHER="Editor - FG Editor Switcher"
PLG_EDITORS_FGEDITORSWITCHER_XML_DESCRIPTION="Umožňuje prepínať, ktorý editor (TinyMCE, CodeMirror, None, ...) sa používa na editovanie polí, priamo cez rozbaľovací zoznam vedľa panela s tlačidlami na obrazovke úpravy — bez nutnosti chodiť do Globálneho nastavenia. Nastavte tento plugin ako predvolený editor stránky, aby fungoval."
PLG_EDITORS_FGEDITORSWITCHER_SELECTEDITOR="Vyberte editor"
PLG_EDITORS_FGEDITORSWITCHER_EDITOR="Predvolený editor"
PLG_EDITORS_FGEDITORSWITCHER_EDITOR_DESC="Editor použitý pri prvom zobrazení, kým sa nezapamätá žiadna voľba."
PLG_EDITORS_FGEDITORSWITCHER_EDITORWASNOTFOUND="Editor sa nepodarilo nájsť. Uistite sa, že zvolený editor je platný a povolený."
PLG_EDITORS_FGEDITORSWITCHER_PRESERVECONTENT="Zachovať obsah pri prepnutí"
PLG_EDITORS_FGEDITORSWITCHER_PRESERVECONTENT_DESC="Prenesie neuložený obsah všetkých editorských polí do novo zvoleného editora namiesto toho, aby sa stratil. Keď sa to podarí, niet čo stratiť, takže sa potvrdenie nižšie nezobrazuje; ak obsah preniesť nemožno (napríklad je príliš veľký alebo prehliadač blokuje úložisko sedenia), na potvrdenie sa opýta ako doteraz. Ostatné polia formulára, napríklad názov alebo vlastné polia, sa vždy načítajú znovu z databázy. Predvolené je Áno."
PLG_EDITORS_FGEDITORSWITCHER_CONTENTRESTORED="Neuložený obsah bol prenesený do nového editora. Stále nie je uložený — nezabudnite ho uložiť."
PLG_EDITORS_FGEDITORSWITCHER_CONFIRMATION="Potvrdenie"
PLG_EDITORS_FGEDITORSWITCHER_CONFIRMATION_DESC="Pred prepnutím editora sa opýta na potvrdenie, keďže neuložené zmeny sa pri prepnutí stratia. Ignoruje sa, kým prenos obsahu funguje. Predvolené je Áno."
PLG_EDITORS_FGEDITORSWITCHER_CONFIRM_MESSAGE="Neuložené zmeny sa pri prepnutí stratia."
PLG_EDITORS_FGEDITORSWITCHER_CONFIRM_MESSAGE_TITLE="Prepnúť editor?"
PLG_EDITORS_FGEDITORSWITCHER_DEBUG="Debug režim"
PLG_EDITORS_FGEDITORSWITCHER_DEBUG_DESC="Keď je zapnutý, vypisuje do konzoly prehliadača aktívny editor a aktuálnu hodnotu cookie. Predvolené je Nie."
PLG_EDITORS_FGEDITORSWITCHER_FIELD_SUPPORT_DESC="<style>a.fg-kofi[target='_blank']::before{content:none;padding:0}</style><div class='mb-3'><strong>Tento plugin je bezplatný a open source.</strong> Ak vám ušetril čas, jednorazový príspevok na Ko-fi je vítaný, no úplne dobrovoľný - žiadna funkcia tu nikdy nie je uzamknutá za platbou.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer' class='fg-kofi'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer' class='btn' style='--btn-color:var(--atum-btn);--btn-bg:var(--atum-btn-bg);--btn-border-color:hsl(var(--hue),20%,80%);--btn-hover-color:var(--atum-btn-hvr);--btn-hover-bg:var(--atum-btn-bg-hvr);--btn-hover-border-color:var(--atum-btn-bg-hvr);--btn-active-color:var(--atum-btn-hvr);--btn-active-bg:var(--atum-btn-bg-hvr);--btn-active-border-color:var(--atum-btn-bg-hvr)'>Ďalšie FG rozšírenia</a></div>"
PLG_EDITORS_FGEDITORSWITCHER_FIELDSET_SETTINGS="Nastavenia"
