PLG_EDITORS_FGEDITORSWITCHER="Editor - FG Editor Switcher"
PLG_EDITORS_FGEDITORSWITCHER_XML_DESCRIPTION="Lets you switch which editor (TinyMCE, CodeMirror, None, ...) is used for editing fields, directly from a dropdown next to the edit screen's toolbar - without going through Global Configuration. Set this plugin as the site's default editor to enable it."
PLG_EDITORS_FGEDITORSWITCHER_SELECTEDITOR="Select editor"
PLG_EDITORS_FGEDITORSWITCHER_EDITOR="Default editor"
PLG_EDITORS_FGEDITORSWITCHER_EDITOR_DESC="The editor used the first time, before any choice has been remembered."
PLG_EDITORS_FGEDITORSWITCHER_EDITORWASNOTFOUND="Could not find the editor. Make sure that the editor you specified is valid and enabled."
PLG_EDITORS_FGEDITORSWITCHER_PRESERVECONTENT="Keep content on switch"
PLG_EDITORS_FGEDITORSWITCHER_PRESERVECONTENT_DESC="Carry the unsaved content of every editor field over to the newly selected editor instead of losing it. When this works there is nothing to lose, so the confirmation below is skipped; if the content cannot be carried over (for example because it is very large, or the browser blocks session storage) the confirmation is asked for as usual. Other form fields, such as the title or custom fields, are always reloaded from the database. Default is Yes."
PLG_EDITORS_FGEDITORSWITCHER_CONTENTRESTORED="Your unsaved content was carried over to the new editor. It is still unsaved - remember to save."
PLG_EDITORS_FGEDITORSWITCHER_CONFIRMATION="Confirmation"
PLG_EDITORS_FGEDITORSWITCHER_CONFIRMATION_DESC="Ask for confirmation before switching editors, since unsaved changes are lost on switch. Ignored while the content is being carried over successfully. Default is Yes."
PLG_EDITORS_FGEDITORSWITCHER_CONFIRM_MESSAGE="Unsaved changes will be lost."
PLG_EDITORS_FGEDITORSWITCHER_CONFIRM_MESSAGE_TITLE="Switch editor?"
PLG_EDITORS_FGEDITORSWITCHER_DEBUG="Debug mode"
PLG_EDITORS_FGEDITORSWITCHER_DEBUG_DESC="When enabled, logs the active editor and the current cookie value to the browser console. Default is No."
